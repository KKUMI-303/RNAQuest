name: RNAseq
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - fastqc
  - multiqc
  - trimmomatic
  - star
  - hisat2
  - samtools
  - subread
  - snakemake
  - r-base=4.3
  - r-ggplot2
  - r-dplyr
  - r-pheatmap
  - r-matrixstats
  - r-polyester
  - bioconductor-deseq2
  - bioconductor-tximport
  - tree
  - seqtk
  - gffread
